    <!-- Script para la animación de aparición al cargar/bajar -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        let lastScrollY = window.scrollY;
        window.addEventListener(
          "scroll",
          function () {
            lastScrollY = window.scrollY;
          },
          { passive: true },
        );

        const observerOptions = {
          root: null,
          rootMargin: "0px",
          threshold: 0.15,
        };

        // Anima cuando BAJAS o en la carga inicial. Al subir se muestran
        // sin transición para que no se vean movimientos raros.
        const observer = new IntersectionObserver((entries) => {
          const down = window.scrollY + 1 > lastScrollY;
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              if (down) {
                entry.target.classList.remove("no-transition");
                entry.target.classList.add("is-visible");
              } else {
                entry.target.classList.add("is-visible", "no-transition");
              }
            }
          });
        }, observerOptions);

        document
          .querySelectorAll(".reveal")
          .forEach((el) => observer.observe(el));
      });
    </script>

    <!-- Botón de filtros (solo móvil): abre/cierra el desplegable -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const toggle = document.querySelector("[data-filters-toggle]");
        const panel = document.getElementById("cat-filtros");
        const cerrarHits = panel
          ? panel.querySelectorAll("[data-filters-close]")
          : [];
        const doneBtn = panel && panel.querySelector("[data-filters-done]");
        if (!toggle || !panel) return;

        function abrir() {
          panel.classList.add("is-open");
          toggle.setAttribute("aria-expanded", "true");
          toggle.classList.add("is-active");
          panel.scrollTop = 0;
        }

        function cerrar(scrollAProductos = true) {
          panel.classList.remove("is-open");
          toggle.setAttribute("aria-expanded", "false");
          toggle.classList.remove("is-active");

          if (scrollAProductos) {
            const catalogoEl =
              document.querySelector(".catalog-main") ||
              document.getElementById("catalogo");
            if (catalogoEl) {
              const headerOffset = 80;
              const targetY =
                window.pageYOffset +
                catalogoEl.getBoundingClientRect().top -
                headerOffset;
              window.scrollTo({
                top: Math.max(0, targetY),
                behavior: "smooth",
              });
            }
          }
        }

        toggle.addEventListener("click", function () {
          if (panel.classList.contains("is-open")) cerrar(false);
          else abrir();
        });

        cerrarHits.forEach((el) => el.addEventListener("click", () => cerrar(true)));
        if (doneBtn) doneBtn.addEventListener("click", () => cerrar(true));

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") cerrar(false);
        });
      });
    </script>
